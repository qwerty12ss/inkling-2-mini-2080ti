name: Check recipe and benchmark data

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate launch profiles, tests and published data
        run: make check
